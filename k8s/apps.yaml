# The app services. One image (built by .github/workflows/image.yml); args pick the service.
# An init container waits for the infrastructure, so pods don't crash-loop on a cold start.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: app }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z rabbitmq 5672 && nc -z redis 6379 && nc -z kafka 9092; do echo waiting for postgres/rabbitmq/redis/kafka; sleep 2; done"]
      containers:
        - name: web
          image: otel-lab-app
          imagePullPolicy: Always
          args: ["web.py"]
          envFrom:
            - configMapRef: { name: lab-config }
            - secretRef: { name: lab-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: web }
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - port: 8000
