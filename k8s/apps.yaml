        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z rabbitmq 5672 && nc -z redis 6379 && nc -z kafka 9092; do echo waiting for postgres/rabbitmq/redis/kafka; sleep 2; done && until wget -qO- http://signup:5001/signup/status >/dev/null 2>&1; do echo waiting for signup schema; sleep 2; done"]
      containers:
        - name: outbox-relay
