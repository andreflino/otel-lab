apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          env:
            - { name: MP_MAX_MESSAGES, value: "500" }
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
